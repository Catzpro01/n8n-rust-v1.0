name: CI

on:
  push:
  pull_request:

# Tiap job men-tee output-nya; saat gagal, baris error diekspor sebagai
# ::error:: annotations (bisa dibaca via Checks API tanpa unduh log).

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: n8n-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: n8n-rust
      - name: cargo test
        run: set -o pipefail; cargo test --workspace --color never 2>&1 | tee /tmp/out.log
      - name: Ekspor error sebagai anotasi
        if: failure()
        run: |
          python3 - <<'EOF'
          import re
          raw = open('/tmp/out.log', 'rb').read().decode('utf-8', 'replace')
          CH = 3500
          parts = [raw[i:i+CH] for i in range(0, len(raw), CH)] or ['']
          rx = re.compile(r'error|warning|Diff in|failures:|panicked|test result|FAILED', re.I)
          keep = [(i, p) for i, p in enumerate(parts) if rx.search(p) or i == len(parts)-1][:8]
          for i, p in keep:
              m = p.replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A')
              print(f"::error::LOG[{i+1}/{len(parts)}]:{m}")
          EOF

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: n8n-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: n8n-rust
      - name: cargo clippy
        run: set -o pipefail; cargo clippy --workspace --all-targets --color never 2>&1 | tee /tmp/out.log
      - name: Ekspor error sebagai anotasi
        if: failure()
        run: |
          python3 - <<'EOF'
          import re
          raw = open('/tmp/out.log', 'rb').read().decode('utf-8', 'replace')
          CH = 3500
          parts = [raw[i:i+CH] for i in range(0, len(raw), CH)] or ['']
          rx = re.compile(r'error|warning|Diff in|failures:|panicked|test result|FAILED', re.I)
          keep = [(i, p) for i, p in enumerate(parts) if rx.search(p) or i == len(parts)-1][:8]
          for i, p in keep:
              m = p.replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A')
              print(f"::error::LOG[{i+1}/{len(parts)}]:{m}")
          EOF

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: n8n-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        run: set -o pipefail; cargo fmt --all --check 2>&1 | tee /tmp/out.log
      - name: Ekspor error sebagai anotasi
        if: failure()
        run: |
          python3 - <<'EOF'
          import re
          raw = open('/tmp/out.log', 'rb').read().decode('utf-8', 'replace')
          CH = 3500
          parts = [raw[i:i+CH] for i in range(0, len(raw), CH)] or ['']
          rx = re.compile(r'error|warning|Diff in|failures:|panicked|test result|FAILED', re.I)
          keep = [(i, p) for i, p in enumerate(parts) if rx.search(p) or i == len(parts)-1][:8]
          for i, p in keep:
              m = p.replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A')
              print(f"::error::LOG[{i+1}/{len(parts)}]:{m}")
          EOF
