name: CI

on:
  push:
    branches: [ main, arena/* ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --manifest-path n8n-rust/Cargo.toml
      - name: cargo clippy
        run: cargo clippy --workspace --manifest-path n8n-rust/Cargo.toml -- -D warnings
      - name: check UI
        run: test -f n8n-rust/crates/n8n-server/ui/app.html && wc -l n8n-rust/crates/n8n-server/ui/app.html

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build docker
        run: docker build -t n8n-rust:test .
