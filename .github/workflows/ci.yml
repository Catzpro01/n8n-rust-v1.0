name: CI

on:
  push:
  pull_request:

# Tiap job men-tee output-nya; saat gagal, baris error diekspor sebagai
# ::error:: annotations (bisa dibaca via Checks API tanpa unduh log).

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: n8n-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: n8n-rust
      - name: cargo test
        run: set -o pipefail; cargo test --workspace --color never 2>&1 | tee /tmp/out.log
      - name: Ekspor error sebagai anotasi
        if: failure()
        run: |
          python3 -c "import sys;d=open('/tmp/out.log','rb').read().decode('utf-8','replace');d=d.replace('%','%25').replace(chr(13),'%0D').replace(chr(10),'%0A');print('::error::FULL-LOG:'+d[:60000])"

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: n8n-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: n8n-rust
      - name: cargo clippy
        run: set -o pipefail; cargo clippy --workspace --all-targets --color never 2>&1 | tee /tmp/out.log
      - name: Ekspor error sebagai anotasi
        if: failure()
        run: |
          python3 -c "import sys;d=open('/tmp/out.log','rb').read().decode('utf-8','replace');d=d.replace('%','%25').replace(chr(13),'%0D').replace(chr(10),'%0A');print('::error::FULL-LOG:'+d[:60000])"

  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: n8n-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt
        run: set -o pipefail; cargo fmt --all --check 2>&1 | tee /tmp/out.log
      - name: Ekspor error sebagai anotasi
        if: failure()
        run: |
          python3 -c "import sys;d=open('/tmp/out.log','rb').read().decode('utf-8','replace');d=d.replace('%','%25').replace(chr(13),'%0D').replace(chr(10),'%0A');print('::error::FULL-LOG:'+d[:60000])"
