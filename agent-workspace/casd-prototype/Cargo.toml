[package]
name = "casd-prototype"
version = "0.1.0"
edition = "2021"
description = "Content-Addressable Spill Deduplication prototype (W2-CASD-DEDUP)"

[dependencies]
blake3 = "1.5"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tempfile = "3"

[dev-dependencies]
rand = "0.8"
