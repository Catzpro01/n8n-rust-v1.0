# W0-SPILL-TEST — independent black-box gate harness for FileSpillStore.
#
# Every gate cites its spec source (CHECKSUM-AGREE §8, PATCH acceptance,
# SINTESIS §6.1.4, SEC-07, kernel trait contract). The harness knows the
# implementation ONLY through the kernel `SpillStore` trait + spec'd errors.
#
# IMPL SWITCH: point `impl-under-test` at the landed implementation crate
# (data-plane per SINTESIS §6.1 / CHECKSUM-AGREE C-5, or storage per fern
# #786 if confirmed). One line, then `cargo test`.
[package]
name = "spill-gates"
version = "0.1.0"
edition = "2021"

[dependencies]
kernel = { path = "/home/agent1/spill-work/crates/kernel" }
impl-under-test = { package = "data-plane", path = "/home/agent1/spill-work/crates/data-plane" }
serde_json = "1"

[dev-dependencies]
libc = "0.2"

[workspace]
