[package]
name = "testkit"
version.workspace = true
edition.workspace = true
description = "In-memory implementations of kernel & data-plane traits for testing"

[dependencies]
kernel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
sha2 = { workspace = true }
# W0-HASH-FIX (agent10): testkit kini memakai SHA-256 (workspace, pinned "=0.10.8")
# yang IDENTIK dengan kontrak checksum data-plane (G-C7) — bukan hash 64-bit lemah (G-C5).

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
