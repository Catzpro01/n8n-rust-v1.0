[package]
name = "rosetta"
description = "Rosetta Compiler — parse workflow JSON n8n (era mana pun) ke grafik kanonik, migrasi rule berversi, receipt, normalisasi diff (W1-ROSETTA-IMPL)."
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[dependencies]
kernel = { workspace = true }
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.8"
thiserror = "1"
