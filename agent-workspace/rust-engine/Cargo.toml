[workspace]
resolver = "2"
members = [
    "crates/storage",
    "crates/executor",
    "crates/nodes-core",
    "crates/nodes-openapi",
    "crates/openapi-codegen",
    "crates/nodes-wasm",
    "crates/cli",
    "crates/rosetta",
    "crates/mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]

kernel = { path = "../kernel-asli-d3bcff0/crates/kernel" }
data-plane = { path = "../kernel-asli-d3bcff0/crates/data-plane" }
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.114"
async-trait = "=0.1.77"
thiserror = "=1.0.57"
tokio = { version = "=1.36.0", features = ["full"] }
chrono = { version = "=0.4.34", features = ["serde"] }
uuid = { version = "=1.7.0", features = ["v4", "serde"] }
tracing = "=0.1.40"
sha2 = "=0.10.8"
rusqlite = { version = "=0.31.0", features = ["bundled"] }
executor = { path = "crates/executor" }
nodes-core = { path = "crates/nodes-core" }
