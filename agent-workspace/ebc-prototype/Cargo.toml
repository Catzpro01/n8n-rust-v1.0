[package]
name = "ebc-prototype"
version = "0.1.0"
edition = "2021"
description = "Expression Bytecode Cache prototype (W1-EBC-CACHE)"

[dependencies]
blake3 = "1.5"
rquickjs = { version = "0.6", features = ["bindgen", "loader", "classes"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
thiserror = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
