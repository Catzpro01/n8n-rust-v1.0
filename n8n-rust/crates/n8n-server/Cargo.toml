[package]
name = "n8n-server"
version = "0.7.0"
edition = "2021"

[dependencies]
n8n-core = { path = "../n8n-core" }
n8n-engine = { path = "../n8n-engine" }
n8n-nodes = { path = "../n8n-nodes" }
axum = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
